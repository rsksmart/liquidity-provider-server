services:
  lbc-deployer:
    build:
      context: ./lbc-deployer
      args:
        LBC_COMMIT: "${LBC_COMMIT}"
        DEPLOYER_MNEMONIC: "${DEPLOYER_MNEMONIC}"
    pull_policy: build
    image: lbc-deployer:local
    volumes:
      - ./lbc-deployer/scripts:/scripts
      - ./${ENV_FILE}:/${ENV_FILE}
    entrypoint: [ "/scripts/deploy.sh" ]
    container_name: lbc-deployer
    restart: "no"
    environment:
      - RSK_ENDPOINT
      - ENV_FILE
      - DEPLOYER_MNEMONIC
    depends_on:
      wallet-funder:
        condition: service_completed_successfully
    networks:
      - net_lps
  lps-approver:
    image: lbc-deployer:local
    pull_policy: never
    volumes:
      - ./lbc-deployer/scripts:/scripts
      - ./${ENV_FILE}:/${ENV_FILE}
    entrypoint: [ "/scripts/approve-registration.sh" ]
    container_name: lps-approver
    restart: "no"
    environment:
      - ENV_FILE
      - RSK_ENDPOINT
      - DEPLOYER_MNEMONIC
      - LIQUIDITY_PROVIDER_RSK_ADDR
      - LP_REGISTRATION_DECISION
    depends_on:
      lbc-deployer:
        condition: service_completed_successfully
    healthcheck:                 
      test: ["CMD-SHELL", "true"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 1s
    networks:
      - net_lps
networks:
  net_lps:
    driver: "bridge"
