services:
  lbc-deployer:
    # TODO: pull a pinned LBC_IMAGE again once a liquidity-bridge-contract image with the v3 contracts is published
    build:
      context: ./lbc-deployer
      args:
        LBC_GIT_REF: "${LBC_GIT_REF:-c6db31618d7f919277f53311f67848bb366c2cb2}"
        LBC_GIT_SHA: "${LBC_GIT_SHA:-}"
    pull_policy: build
    image: lps-lbc-deployer:local
    volumes:
      - ./lbc-deployer/scripts:/scripts
      - ./${ENV_FILE}:/${ENV_FILE}
    entrypoint: [ "/scripts/deploy.sh" ]
    container_name: lbc-deployer
    restart: "no"
    environment:
      - RSK_ENDPOINT
      - ENV_FILE
      - DEPLOYER_MNEMONIC
    depends_on:
      wallet-funder:
        condition: service_completed_successfully
    networks:
      - net_lps
  lps-approver:
    image: lps-lbc-deployer:local
    pull_policy: never
    volumes:
      - ./lbc-deployer/scripts:/scripts
      - ./${ENV_FILE}:/${ENV_FILE}
    entrypoint: [ "/scripts/approve-registration.sh" ]
    container_name: lps-approver
    restart: "no"
    environment:
      - ENV_FILE
      - RSK_ENDPOINT
      - DEPLOYER_MNEMONIC
      - LIQUIDITY_PROVIDER_RSK_ADDR
      - LP_REGISTRATION_DECISION
    depends_on:
      lbc-deployer:
        condition: service_completed_successfully
    healthcheck:                 
      test: ["CMD-SHELL", "true"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 1s
    networks:
      - net_lps
networks:
  net_lps:
    driver: "bridge"
