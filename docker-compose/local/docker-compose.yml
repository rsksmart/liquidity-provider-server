services:
  localstack:
    build:
      context: ./localstack
      args:
        UID: "${LPS_UID}"
    pull_policy: build
    container_name: localstack
    image: flyover-localstack
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      - DEBUG=${DEBUG:-0}
    volumes:
      - "${LOCALSTACK_HOME:-./volumes/localstack}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - net_lps
  bitcoind:
    build:
      context: ../bitcoind
      args:
        UID: "${LPS_UID}"
    pull_policy: build
    image: bitcond:latest
    container_name: bitcoind01
    environment:
      - BTC_USERNAME
      - BTC_PASSWORD
    ports:
      - "5555:5555"
    volumes:
      - ${BTCD_HOME:-./volumes/bitcoind}:/home/bitcoind/.bitcoind
    networks:
      - net_lps
    command:
      [
        "bitcoind",
        "-rpcuser=${BTC_USERNAME}",
        "-rpcpassword=${BTC_PASSWORD}",
        "-addresstype=legacy",
        "-${LPS_STAGE}",
        "-printtoconsole",
        "-server",
        "-txindex",
        "-deprecatedrpc=signrawtransaction",
        "-deprecatedrpc=accounts",
        "-rpcbind=0.0.0.0",
        "-rpcallowip=0.0.0.0/0",
        "-rpcport=5555",
      ]
  rskj:
    build:
      context: ../rskj
      args:
        UID: "${LPS_UID}"
    pull_policy: build
    image: rskj:latest
    container_name: rskj01
    ports:
      - "4444:4444"
      - "4445:4445"
    volumes:
      - ${RSKJ_HOME:-./volumes/rskj}/db:/var/lib/rsk/database
      - ${RSKJ_HOME:-./volumes/rskj}/logs:/var/log/rsk
    networks:
      - net_lps
    command:
      [
        "--${LPS_STAGE}",
      ]
  mongo-keyfile-init:
    image: alpine:3.20
    container_name: mongo-keyfile-init
    restart: "no"
    entrypoint:
      - sh
      - -c
      - apk add --no-cache openssl >/dev/null && sh /keyfile-init.sh
    volumes:
      - ../mongo/keyfile-init.sh:/keyfile-init.sh:ro
      - mongo_keyfile:/keyfile
    networks:
      - net_lps
  mongodb:
    image: mongo:4
    restart: on-failure
    container_name: mongo01
    hostname: mongo01
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
    environment:
      - MONGO_INITDB_ROOT_USERNAME=$MONGODB_USER
      - MONGO_INITDB_ROOT_PASSWORD=$MONGODB_PASSWORD
      - MONGO_INITDB_DATABASE=flyover
    ports:
      - 27017:27017
    volumes:
      - ${MONGO_HOME:-./volumes/mongo}/logs:/data/db
      - mongo_keyfile:/etc/mongo:ro
    expose:
      - 27017
    networks:
      - net_lps
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /etc/mongo/mongo-keyfile
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          mongo --quiet
          -u "$$MONGO_INITDB_ROOT_USERNAME"
          -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'rs.isMaster().ismaster' | grep -q true
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  mongo-rs-init:
    image: mongo:4
    container_name: mongo-rs-init
    restart: "no"
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_started
    environment:
      - MONGO_INITDB_ROOT_USERNAME=$MONGODB_USER
      - MONGO_INITDB_ROOT_PASSWORD=$MONGODB_PASSWORD
      - MONGO_HOST=mongo01
      - MONGO_PORT=27017
      - REPLICA_SET=rs0
    volumes:
      - ../mongo/init-replica-set.sh:/init-replica-set.sh:ro
    networks:
      - net_lps
    entrypoint: ["bash", "/init-replica-set.sh"]

volumes:
  mongo_keyfile:

networks:
  net_lps:
    driver: "bridge"
