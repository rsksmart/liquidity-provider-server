repos:
  - repo: https://github.com/golangci/golangci-lint
    rev: v1.63.4
    hooks:
      - id: golangci-lint-full
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.0
    hooks:
      - id: commitizen
  - repo: local
    hooks:
      - id: unit-tests
        name: LPS Unit Tests
        entry: make test
        language: system
        types: [go]
  - repo: local
    hooks:
      - id: code-style
        name: LPS Code Style Check
        entry: make lint
        language: system
        types: [go]
  - repo: local
    hooks:
      - id: ui-lint
        name: UI Lint
        entry: bash -c 'cd ui && pnpm run lint'
        language: system
        files: ^ui/
      - id: ui-test
        name: UI Tests
        entry: bash -c 'cd ui && pnpm run test'
        language: system
        files: ^ui/
      - id: ui-build
        name: UI Build
        entry: make ui-build
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: go-build-check
        name: Go Build Check
        entry: make build
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.16.3
    hooks:
      - id: gitleaks
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: "trailing-whitespace"
      - id: "end-of-file-fixer"
        exclude: '\.tf\.json$'
      - id: "check-yaml"
        args:
          - "--unsafe"
      - id: "check-executables-have-shebangs"
      - id: "check-case-conflict"
  - repo: https://github.com/mrtazz/checkmake.git
    rev: 0.2.2
    hooks:
      -   id: checkmake
