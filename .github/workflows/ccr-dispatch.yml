name: CCR follow-up dispatch

# Copy this file to .github/workflows/ccr-dispatch.yml in a consumer repository.
# It only starts the follow-up in the framework repo. It does not run scripts here.

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      review_id:
        description: Copilot review id (leave empty for latest)
        required: false
        type: string
      dry_run:
        description: Compute artifacts but do not post comments
        required: false
        type: boolean
        default: true
      skip_lessons:
        description: Skip lesson authoring
        required: false
        type: boolean
        default: false
      skip_inspect:
        description: Skip model inspect of changed spans
        required: false
        type: boolean
        default: false

# While experimental, keep automatic pull_request_review off the default branch
# or leave this workflow on a side branch and run it with workflow_dispatch.

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.review.user.login == 'copilot-pull-request-reviewer[bot]' ||
      github.event.review.user.login == 'Copilot'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve inputs
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_REVIEW: ${{ inputs.review_id }}
          INPUT_DRY: ${{ inputs.dry_run }}
          INPUT_SKIP: ${{ inputs.skip_lessons }}
          INPUT_SKIP_INSPECT: ${{ inputs.skip_inspect }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_REVIEW: ${{ github.event.review.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "pr_number=${INPUT_PR}" >> "$GITHUB_OUTPUT"
            echo "review_id=${INPUT_REVIEW}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${INPUT_DRY}" >> "$GITHUB_OUTPUT"
            echo "skip_lessons=${INPUT_SKIP}" >> "$GITHUB_OUTPUT"
            echo "skip_inspect=${INPUT_SKIP_INSPECT}" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=${EVENT_PR}" >> "$GITHUB_OUTPUT"
            echo "review_id=${EVENT_REVIEW}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "skip_lessons=false" >> "$GITHUB_OUTPUT"
            echo "skip_inspect=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch framework follow-up
        env:
          GH_TOKEN: ${{ secrets.CCR_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          FRAMEWORK_REPO: rsksmart/copilot-review-template
        run: |
          set -euo pipefail
          gh workflow run ccr-followup.yml \
            --repo "$FRAMEWORK_REPO" \
            -f repository="${{ github.repository }}" \
            -f pr_number="${{ steps.meta.outputs.pr_number }}" \
            -f review_id="${{ steps.meta.outputs.review_id }}" \
            -f dry_run="${{ steps.meta.outputs.dry_run }}" \
            -f skip_lessons="${{ steps.meta.outputs.skip_lessons }}" \
            -f skip_inspect="${{ steps.meta.outputs.skip_inspect }}"
